<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.90  0 0 0 0 0.84  0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="#f4efe4"/>
    <rect width="1024" height="1024" fill="#efe8d8" filter="url(#paper)" opacity="0.9"/>

    <!-- Grue portique en fond, trait d'encre léger -->
    <g fill="none" stroke="#141414" stroke-linecap="round" opacity="0.55" filter="url(#ink)">
      <path d="M640 120 L 640 560 M 900 120 L 900 560 M 600 150 L 940 150 M 640 200 L 900 200" stroke-width="9"/>
      <path d="M700 150 L 700 200 M 760 150 L 760 200 M 820 150 L 820 200 M 860 150 L 860 200" stroke-width="6"/>
      <path d="M760 200 L 760 300" stroke-width="5"/>
      <path d="M745 300 L 775 300 L 770 318 L 750 318 Z" stroke-width="6"/>
    </g>
    <!-- Conteneur suspendu à la grue -->
    <g filter="url(#ink)">
      <rect x="690" y="320" width="140" height="72" fill="#b8302a"/>
      <path d="M700 330 L 700 382 M 720 330 L 720 382 M 800 330 L 800 382 M 820 330 L 820 382" stroke="#f4efe4" stroke-width="5" opacity="0.8"/>
    </g>
    <!-- Pile de conteneurs au sol, derrière le panda -->
    <g filter="url(#ink)">
      <rect x="620" y="560" width="150" height="76" fill="#141414"/>
      <rect x="780" y="560" width="150" height="76" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="700" y="476" width="150" height="76" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="860" y="476" width="110" height="76" fill="#1d4f8a"/>
    </g>

    <!-- Quai -->
    <path d="M40 640 L 984 640" stroke="#141414" stroke-width="10" stroke-linecap="round" filter="url(#ink)"/>

    <!-- ===== Panda docker ===== -->
    <g filter="url(#ink)">
      <!-- Jambes / pantalon -->
      <path d="M300 560 L 290 660 L 340 660 L 350 570 Z" fill="#2b2b2b"/>
      <path d="M380 560 L 390 660 L 440 660 L 430 570 Z" fill="#2b2b2b"/>
      <!-- Chaussures de sécurité -->
      <path d="M270 660 L 350 660 L 356 690 L 262 690 Z" fill="#141414"/>
      <path d="M382 660 L 462 660 L 470 690 L 376 690 Z" fill="#141414"/>
      <!-- Corps (ventre blanc) -->
      <ellipse cx="365" cy="470" rx="120" ry="130" fill="#f8f5ee" stroke="#141414" stroke-width="9"/>
      <!-- Gilet orange haute visibilité -->
      <path d="M270 380 C 240 430, 240 520, 265 585 L 320 585 L 320 380 Z" fill="#e8721c" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
      <path d="M460 380 C 490 430, 490 520, 465 585 L 410 585 L 410 380 Z" fill="#e8721c" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
      <path d="M262 470 L 320 470 M 410 470 L 468 470 M 262 520 L 320 520 M 410 520 L 468 520" stroke="#f4efe4" stroke-width="10"/>
      <!-- Les deux bras poussent le conteneur (à gauche) -->
      <path d="M262 430 C 210 445, 190 500, 205 548" fill="none" stroke="#141414" stroke-width="30" stroke-linecap="round"/>
      <path d="M330 560 C 300 590, 260 590, 236 560" fill="none" stroke="#141414" stroke-width="30" stroke-linecap="round"/>
      <!-- Tête -->
      <circle cx="365" cy="300" r="118" fill="#f8f5ee" stroke="#141414" stroke-width="9"/>
      <!-- Oreilles -->
      <circle cx="270" cy="215" r="44" fill="#141414"/>
      <circle cx="460" cy="215" r="44" fill="#141414"/>
      <!-- Taches des yeux -->
      <ellipse cx="318" cy="300" rx="38" ry="46" fill="#141414" transform="rotate(-15 318 300)"/>
      <ellipse cx="412" cy="300" rx="38" ry="46" fill="#141414" transform="rotate(15 412 300)"/>
      <circle cx="326" cy="296" r="11" fill="#f8f5ee"/>
      <circle cx="404" cy="296" r="11" fill="#f8f5ee"/>
      <circle cx="329" cy="298" r="5" fill="#141414"/>
      <circle cx="407" cy="298" r="5" fill="#141414"/>
      <!-- Museau -->
      <ellipse cx="365" cy="356" rx="22" ry="14" fill="#141414"/>
      <path d="M365 368 Q 365 385, 345 390 M 365 368 Q 365 385, 385 390" fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
      <!-- Casque de chantier jaune -->
      <path d="M248 250 C 250 160, 480 160, 482 250 Z" fill="#f2b632" stroke="#141414" stroke-width="9" stroke-linejoin="round"/>
      <rect x="232" y="240" width="266" height="26" rx="8" fill="#f2b632" stroke="#141414" stroke-width="8"/>
      <path d="M355 178 L 375 178 L 375 230 L 355 230 Z" fill="#141414" opacity="0.35"/>
    </g>

    <!-- Diable + conteneur poussé par le panda -->
    <g filter="url(#ink)">
      <!-- conteneur -->
      <rect x="110" y="536" width="190" height="104" fill="#1d4f8a" stroke="#141414" stroke-width="9"/>
      <path d="M135 552 L 135 630 M 160 552 L 160 630 M 260 552 L 260 630 M 285 552 L 285 630" stroke="#f4efe4" stroke-width="5" opacity="0.8"/>
      <!-- chariot -->
      <path d="M100 646 L 320 646" stroke="#141414" stroke-width="10" stroke-linecap="round"/>
      <circle cx="130" cy="672" r="20" fill="#141414"/>
      <circle cx="290" cy="672" r="20" fill="#141414"/>
      <circle cx="130" cy="672" r="7" fill="#f4efe4"/>
      <circle cx="290" cy="672" r="7" fill="#f4efe4"/>
    </g>

    <!-- Eau : traits de pinceau -->
    <g fill="none" stroke="#141414" stroke-linecap="round" filter="url(#ink)">
      <path d="M70 790 C 140 760, 180 820, 250 790 S 360 760, 430 792" stroke-width="15"/>
      <path d="M500 800 C 570 770, 620 830, 690 800 S 810 770, 940 802" stroke-width="15"/>
      <path d="M130 860 C 220 830, 280 890, 370 860 S 510 830, 590 862" stroke-width="11" opacity="0.8"/>
      <path d="M650 868 C 720 838, 780 898, 880 866" stroke-width="11" opacity="0.8"/>
      <path d="M240 920 C 330 892, 400 946, 500 918 S 640 890, 740 922" stroke-width="8" opacity="0.6"/>
    </g>

    <!-- Sceau rouge -->
    <g transform="translate(60 60)" opacity="0.88">
      <rect x="0" y="0" width="108" height="108" rx="10" fill="#b8302a" filter="url(#ink)"/>
      <text x="54" y="80" font-family="'STKaiti','Kaiti SC','KaiTi','Noto Serif SC',serif" font-size="72" font-weight="700" fill="#f4efe4" text-anchor="middle">港</text>
    </g>
  </g>
</svg>
