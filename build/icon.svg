<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Texture d'encre : bords irréguliers et légères bavures -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="g"/>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.90  0 0 0 0 0.84  0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <!-- Papier -->
    <rect width="1024" height="1024" fill="#f4efe4"/>
    <rect width="1024" height="1024" fill="#efe8d8" filter="url(#paper)" opacity="0.9"/>

    <!-- Lavis gris du ciel / horizon -->
    <g filter="url(#wash)" opacity="0.16">
      <ellipse cx="540" cy="300" rx="430" ry="95" fill="#3b3a36"/>
    </g>
    <!-- Soleil pâle au pinceau -->
    <circle cx="780" cy="260" r="62" fill="none" stroke="#9a2f2a" stroke-width="10" opacity="0.75" filter="url(#ink)"/>

    <!-- Coque : masse d'encre pleine, bord irrégulier -->
    <g filter="url(#ink)">
      <path d="M128 636 L 918 636 C 905 700, 840 752, 730 754 L 340 754 C 245 750, 168 708, 128 636 Z" fill="#141414"/>
      <!-- Étrave et relief -->
      <path d="M128 636 L 96 560 L 150 610 Z" fill="#141414"/>
      <path d="M180 662 Q 520 730, 880 672" fill="none" stroke="#f4efe4" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    </g>
    <!-- Conteneurs : blocs d'encre, certains pleins, certains en réserve -->
    <g filter="url(#ink)">
      <rect x="290" y="560" width="120" height="70" fill="#141414"/>
      <rect x="418" y="560" width="120" height="70" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="546" y="560" width="120" height="70" fill="#141414"/>
      <rect x="674" y="560" width="120" height="70" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="352" y="482" width="120" height="70" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="480" y="482" width="120" height="70" fill="#141414"/>
      <rect x="608" y="482" width="120" height="70" fill="none" stroke="#141414" stroke-width="12"/>
      <rect x="418" y="404" width="120" height="70" fill="#141414"/>
      <rect x="546" y="404" width="120" height="70" fill="none" stroke="#141414" stroke-width="12"/>
      <!-- Passerelle / château arrière -->
      <rect x="806" y="470" width="80" height="160" fill="#141414"/>
      <rect x="818" y="440" width="56" height="34" fill="none" stroke="#141414" stroke-width="10"/>
      <!-- Cheminée et fumée -->
      <rect x="828" y="392" width="28" height="52" fill="#141414"/>
      <path d="M842 386 C 830 350, 872 336, 856 300 C 846 276, 882 258, 872 232" fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Vagues : traits de pinceau nerveux -->
    <g fill="none" stroke="#141414" stroke-linecap="round" filter="url(#ink)">
      <path d="M90 790 C 160 760, 200 820, 270 790 S 380 760, 450 792" stroke-width="16"/>
      <path d="M520 800 C 590 770, 640 830, 710 800 S 830 770, 940 802" stroke-width="16"/>
      <path d="M140 860 C 230 830, 290 890, 380 860 S 520 830, 600 862" stroke-width="12" opacity="0.8"/>
      <path d="M660 868 C 730 838, 790 898, 880 866" stroke-width="12" opacity="0.8"/>
      <path d="M240 920 C 330 892, 400 946, 500 918 S 640 890, 740 922" stroke-width="9" opacity="0.6"/>
    </g>

    <!-- Sceau rouge (cachet) -->
    <g transform="translate(112 112)" opacity="0.88">
      <rect x="0" y="0" width="118" height="118" rx="10" fill="#b8302a" filter="url(#ink)"/>
      <text x="59" y="86" font-family="'STKaiti','Kaiti SC','KaiTi','Noto Serif SC',serif" font-size="78" font-weight="700" fill="#f4efe4" text-anchor="middle">港</text>
    </g>
  </g>
</svg>
