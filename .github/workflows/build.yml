# Compile Bao pour Windows (.exe) et Mac (.dmg) à chaque push sur main,
# puis publie les installeurs dans la page "Releases" du dépôt (release "v<version>" du package.json).
name: Build Bao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Pas de signature Apple pour l'instant (ajouter les secrets CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID… plus tard)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Bao ${{ steps.v.outputs.version }}
          body: |
            Installeurs Bao (BudinBox). Les postes déjà équipés peuvent aussi passer par Réglages → Mise à jour de Bao.
            - **Windows** : téléchargez le `.exe` et lancez-le.
            - **Mac** : téléchargez le `.dmg` (`arm64` pour les Mac Apple Silicon M1/M2/M3/M4, `x64` pour les Mac Intel), glissez Bao dans Applications. Au premier lancement : clic droit → Ouvrir (app non signée), ou dans le Terminal `xattr -dr com.apple.quarantine /Applications/Bao.app`.
          files: installers/*
